<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1144" viewBox="0 0 1160 1144"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#62846d"/></marker></defs><rect width="100%" height="100%" fill="#f4f7ef"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#234b39"><text x="50" y="50" font-size="28" font-weight="bold">V2 · 一次聊天请求</text><rect x="50.0" y="85" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="115" text-anchor="middle" font-size="17">1 · Session + CSRF</text><text x="580.0" y="138" text-anchor="middle" font-size="14">捕获真实登录用户，分配新的请求关联ID</text><rect x="50.0" y="213" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="243" text-anchor="middle" font-size="17">2 · 开启数据库总预算</text><text x="580.0" y="266" text-anchor="middle" font-size="14">2委派 / 8工具 / 2底层检索 / 12模型 / 240秒</text><rect x="50.0" y="341" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="371" text-anchor="middle" font-size="17">3 · 协调 Agent</text><text x="580.0" y="394" text-anchor="middle" font-size="14">结合所属会话历史改写问题并选择 Skill</text><rect x="50.0" y="469" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="499" text-anchor="middle" font-size="17">4 · 至多两个专业 Agent</text><text x="580.0" y="522" text-anchor="middle" font-size="14">各自独立提示词、白名单、步骤和运行记录</text><rect x="50.0" y="597" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="627" text-anchor="middle" font-size="17">5 · 真实 MCP HTTP 传输</text><text x="580.0" y="650" text-anchor="middle" font-size="14">初始化、发现工具、验证短期签名身份</text><rect x="50.0" y="725" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="755" text-anchor="middle" font-size="17">6 · 原子扣预算并执行获准工具</text><text x="580.0" y="778" text-anchor="middle" font-size="14">查本人订单 / 检索真实原文 / 后端准备方案</text><rect x="50.0" y="853" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="883" text-anchor="middle" font-size="17">7 · 无工具最终回答</text><text x="580.0" y="906" text-anchor="middle" font-size="14">引用真实来源；区分查询、生成方案和执行</text><rect x="50.0" y="981" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="1011" text-anchor="middle" font-size="17">8 · 持久化完整执行链路</text><text x="580.0" y="1034" text-anchor="middle" font-size="14">实际服务商 Token、首字及总耗时；错误如实记录</text><path d="M580.0,175 L580.0,207" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,303 L580.0,335" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,431 L580.0,463" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,559 L580.0,591" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,687 L580.0,719" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,815 L580.0,847" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,943 L580.0,975" stroke="#62846d" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>