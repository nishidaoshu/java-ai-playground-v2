<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1144" viewBox="0 0 1160 1144"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#62846d"/></marker></defs><rect width="100%" height="100%" fill="#f4f7ef"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#234b39"><text x="50" y="50" font-size="28" font-weight="bold">V2 · 确认与丢弃生命周期</text><rect x="50.0" y="85" width="1060.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="580.0" y="115" text-anchor="middle" font-size="17">PENDING 待确认方案</text><text x="580.0" y="138" text-anchor="middle" font-size="14">聊天生成不修改订单；文字确认无效</text><rect x="50.0" y="213" width="518.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="309.0" y="243" text-anchor="middle" font-size="17">用户点击确认</text><text x="309.0" y="266" text-anchor="middle" font-size="14">Session + CSRF + 归属</text><rect x="592.0" y="213" width="518.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="851.0" y="243" text-anchor="middle" font-size="17">用户点击丢弃</text><text x="851.0" y="266" text-anchor="middle" font-size="14">Session + CSRF + 归属</text><rect x="50.0" y="341" width="518.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="309.0" y="371" text-anchor="middle" font-size="17">锁方案 → 锁归属订单</text><text x="309.0" y="394" text-anchor="middle" font-size="14">与丢弃竞争同一方案锁</text><rect x="592.0" y="341" width="518.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="851.0" y="371" text-anchor="middle" font-size="17">锁同一方案</text><text x="851.0" y="394" text-anchor="middle" font-size="14">过期 / 旧版本仍可清理</text><rect x="50.0" y="469" width="518.0" height="90" rx="12" fill="white" stroke="#a3bea1" stroke-width="2"/><text x="309.0" y="499" text-anchor="middle" font-size="17">重查全部业务条件</text><text x="309.0" y="522" text-anchor="middle" font-size="14">有效期、版本、状态、日期、舱位、规