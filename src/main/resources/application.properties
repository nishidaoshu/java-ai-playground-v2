server.port=${APP_PORT:8082}
server.address=127.0.0.1
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15433/java_ai_v2}
spring.datasource.username=${DB_USER:java_ai_v2}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.jackson.time-zone=Asia/Shanghai
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla
logging.level.org.atmosphere=WARN
logging.level.dev.langchain4j=WARN
logging.level.org.springframework.security=WARN
spring.mustache.check-template-location=false
app.ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.key=${DEEPSEEK_API_KEY:unconfigured}
app.ai.model=${DEEPSEEK_MODEL:deepseek-flash}
app.ai.rerank-model=${RERANK_MODEL:deepseek-flash}
app.embedding.base-url=${EMBEDDING_BASE_URL:http://127.0.0.1:18083/v1}
app.embedding.model=bge-small-zh-v1.5
app.rag.chunk-size=420
app.rag.overlap=80
app.rag.candidates=8
app.rag.top-k=4
app.rag.min-similarity=0.50
app.rag.retry-min-similarity=0.40
app.rag.rerank-threshold=0.60
app.workflow.ttl-seconds=300
app.mcp.base-url=${MCP_BASE_URL:http://127.0.0.1:18084}
app.mcp.service-token=${MCP_SERVICE_TOKEN}
app.mcp.signing-key=${MCP_SIGNING_KEY}
app.budget.delegations=${V2_MAX_DELEGATIONS:2}
app.budget.tools=${V2_MAX_TOOLS:8}
app.budget.retrievals=${V2_MAX_RETRIEVALS:2}
app.budget.models=${V2_MAX_MODELS:12}
app.budget.seconds=${V2_MAX_SECONDS:240}
logging.level.io.modelcontextprotocol=OFF
